name: Isabelle

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: isabelle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      ISABELLE_VERSION: '2025-2'
      AFP_DATE: '2026-02-06'
      ISABELLE_HOME_USER: ${{ github.workspace }}/.isabelle-user
    steps:
      - uses: actions/checkout@v4

      - name: Cache Isabelle and compiled heaps
        uses: actions/cache@v4
        with:
          path: |
            .ci-deps
            .isabelle-user
          key: isabelle-${{ runner.os }}-2025-2-afp-${{ env.AFP_DATE }}-base
          restore-keys: |
            isabelle-${{ runner.os }}-2025-2-afp-${{ env.AFP_DATE }}-
            isabelle-${{ runner.os }}-2025-2-
            
      - name: Install Isabelle distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-deps
          if [ ! -x ".ci-deps/Isabelle${ISABELLE_VERSION}/bin/isabelle" ]; then
            curl -fL --retry 3 --connect-timeout 30 \
              "https://isabelle.in.tum.de/website-Isabelle${ISABELLE_VERSION}/dist/Isabelle${ISABELLE_VERSION}_linux.tar.gz" \
              -o .ci-deps/isabelle.tar.gz
            tar -xzf .ci-deps/isabelle.tar.gz -C .ci-deps
            rm .ci-deps/isabelle.tar.gz
          fi
      - name: Download required AFP entries
        shell: bash
        run: |
          set -euo pipefail
          cd .ci-deps
          
          # Download and extract PAL
          if [ ! -d PAL ]; then
            curl -fL --retry 3 --connect-timeout 30 \
              "https://isa-afp.org/release/afp-PAL-${AFP_DATE}.tar.gz" \
              -o pal.tar.gz
            mkdir -p afp-extract-pal
            tar -xzf pal.tar.gz -C afp-extract-pal
            root_file="$(find afp-extract-pal -type f -name ROOT -print -quit)"
            test -n "$root_file"
            mv "$(dirname "$root_file")" PAL
            rm -rf afp-extract-pal pal.tar.gz
          fi

          # Download and extract GewirthPGCProof (which provides GewirthArgument)
          if [ ! -d GewirthPGCProof ]; then
            curl -fL --retry 3 --connect-timeout 30 \
              "https://isa-afp.org/release/afp-GewirthPGCProof-${AFP_DATE}.tar.gz" \
              -o gewirth.tar.gz
            mkdir -p afp-extract-gewirth
            tar -xzf gewirth.tar.gz -C afp-extract-gewirth
            root_file="$(find afp-extract-gewirth -type f -name ROOT -print -quit)"
            test -n "$root_file"
            mv "$(dirname "$root_file")" GewirthPGCProof
            rm -rf afp-extract-gewirth gewirth.tar.gz
          fi

      - name: Check ROOT and theory names
        shell: bash
        run: |
          set -euo pipefail
          test -f Isabelle/bin/isabelle/ROOT
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          root = Path('Isabelle/bin/isabelle/ROOT').read_text()
          for filename in ('Morality_Audit_Pigden_Final_Verified.thy', 'Morality_Argument_Audit.thy'):
              p = Path('Isabelle/bin/isabelle') / filename
              if not p.exists():
                  print(f'Missing theory file: {p}', file=sys.stderr)
                  sys.exit(1)
              m = re.search(r'^\s*theory\s+(\S+)', p.read_text(encoding='utf-8-sig'), re.M)
              if not m:
                  print(f'No theory declaration in {p}', file=sys.stderr)
                  sys.exit(1)
              if m.group(1) != p.stem:
                  print(f'{p.name}: theory declares {m.group(1)!r}, but filename requires {p.stem!r}', file=sys.stderr)
                  sys.exit(1)
          print('Theory filenames and declarations match.')
          PY
      - name: Build only the requested session using available heaps
        shell: bash
        run: |
          set -euo pipefail
          ISABELLE="$GITHUB_WORKSPACE/.ci-deps/Isabelle${ISABELLE_VERSION}/bin/isabelle"
          "$ISABELLE" build -c -v -j 2 -o threads=2 \
            -d "$GITHUB_WORKSPACE/.ci-deps/PAL" \
            -d "$GITHUB_WORKSPACE/.ci-deps/GewirthPGCProof" \
            -d "$GITHUB_WORKSPACE/Isabelle/bin/isabelle" \
            Argument_Audit 2>&1 | tee "$RUNNER_TEMP/isabelle-build.log"     
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isabelle-build-log
          path: ${{ runner.temp }}/isabelle-build.log
          if-no-files-found: ignore
      - name: Generate GitHub build attestation
        if: success() && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/isabelle-build.log
      - name: Verify GitHub attestation
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          test -f "$RUNNER_TEMP/isabelle-build.log"

          gh attestation verify \
            "$RUNNER_TEMP/isabelle-build.log" \
            --repo "$GITHUB_REPOSITORY"
          
