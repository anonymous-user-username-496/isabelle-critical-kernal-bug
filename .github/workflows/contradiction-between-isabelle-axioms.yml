name: Isabelle

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: isabelle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      ISABELLE_VERSION: '2025-2'
      AFP_DATE: '2026-02-06'
      ISABELLE_HOME_USER: ${{ github.workspace }}/.isabelle-user
    steps:
      - uses: actions/checkout@v4

      - name: Cache Isabelle and compiled heaps
        uses: actions/cache@v4
        with:
          path: |
            .ci-deps
            .isabelle-user
          key: isabelle-${{ runner.os }}-2025-2-afp-${{ env.AFP_DATE }}-base
          restore-keys: |
            isabelle-${{ runner.os }}-2025-2-afp-${{ env.AFP_DATE }}-
            isabelle-${{ runner.os }}-2025-2-
            
      - name: Install Isabelle distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-deps
          if [ ! -x ".ci-deps/Isabelle${ISABELLE_VERSION}/bin/isabelle" ]; then
            curl -fL --retry 3 --connect-timeout 30 \
              "https://isabelle.in.tum.de/website-Isabelle${ISABELLE_VERSION}/dist/Isabelle${ISABELLE_VERSION}_linux.tar.gz" \
              -o .ci-deps/isabelle.tar.gz
            tar -xzf .ci-deps/isabelle.tar.gz -C .ci-deps
            rm .ci-deps/isabelle.tar.gz
          fi
          
      - name: Build only the requested session using available heaps
        shell: bash
        run: |
          set -euo pipefail
          ISABELLE="$GITHUB_WORKSPACE/.ci-deps/Isabelle${ISABELLE_VERSION}/bin/isabelle"
          "$ISABELLE" build -c -v
            -d "$GITHUB_WORKSPACE/Isabelle/bin/isabelle" \
            Argument_Audit 2>&1 | tee "$RUNNER_TEMP/isabelle-build.log"     
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isabelle-build-log
          path: ${{ runner.temp }}/isabelle-build.log
          if-no-files-found: ignore
      - name: Generate GitHub build attestation
        if: success() && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/isabelle-build.log
      - name: Verify GitHub attestation
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          test -f "$RUNNER_TEMP/isabelle-build.log"

          gh attestation verify \
            "$RUNNER_TEMP/isabelle-build.log" \
            --repo "$GITHUB_REPOSITORY"
          
